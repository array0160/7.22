name: Deploy BookOCR to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Find BookOCR project
        id: project
        shell: bash
        run: |
          if [ -f "./package.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "BookOCR found in repository root."
          else
            PROJECT_DIR="$(find . -mindepth 2 -maxdepth 2 -type f -name package.json -print -quit | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Cannot find package.json"
              echo "Repository files:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "BookOCR found in: $PROJECT_DIR"
          fi

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
